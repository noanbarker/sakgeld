<!doctype html>
<html data-geo="__GEO__">
<head>
<meta charset="utf-8">
<!-- The section reaches its artwork and fonts by relative paths ("images/...",
     "fonts/..."), exactly as index.html does. This page is served from a
     staging folder one level down, so without a base every one of those 404s. -->
<base href="/">
<style>__FONTS__</style>
<style>
  html,body{margin:0}
  body{background:#f6faf7;background-image:linear-gradient(170deg,#f0fdf4 0%,#ecfdf5 45%,#f0f9ff 100%);background-repeat:no-repeat;background-size:100% 900px;
       font-family:'Nunito',system-ui,sans-serif;color:#1e293b}
  .geo-row{display:none}
  html[data-geo="ROW"] .geo-za{display:none}
  html[data-geo="ROW"] .geo-row{display:inline}
  /* Every frame is drawn at an exact moment, so the browser must not be
     interpolating anything of its own between them. */
  .pr-treegrow-slot{opacity:0;transform:scaleY(.05);transform-origin:bottom center;transition:none!important}
  .pr-treegrow-mobile-img{transition:none!important}
  /* The divider belongs beside the words on the page. On its own it is a line
     running off the edge of the picture. */
  body.cut-panel .pr-treegrow{border-left:none!important;padding-left:0!important}

  /* ── the reel ──────────────────────────────────────────────────────────────
     The phone's treatment of this section — the running tally with one tree
     under it — given the room a 9:16 frame has. The stage is 360×640 CSS and
     the capture runs at 3x, so it comes out at 1080×1920 with no resampling,
     and a tree fills about the same pixels as the artwork it was drawn at. */
  #tg-reel{display:none}
  body.cut-reel #tg-stage{display:none}
  body.cut-reel #tg-reel{position:absolute;top:0;left:0;width:360px;height:640px;
    background:#dcfce7;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding-bottom:56px;box-sizing:border-box}
  body.cut-reel .pr-treegrow{border:none!important;padding:0!important;margin:0!important;width:100%}
  body.cut-reel .pr-treegrow-row-desktop{display:none!important}
  body.cut-reel .pr-treegrow-mobile{display:flex!important}
  /* The phone's own sizes are built for a phone. Scaled up for a reel the
     wording and the numbers stay the section's, and so does every proportion
     between one tree and the next. */
  body.cut-reel .pr-treegrow-eyebrow{font-size:15px!important;letter-spacing:.12em!important}
  body.cut-reel .pr-treegrow-counter{font-size:54px!important;line-height:1.05!important}
  body.cut-reel .pr-treegrow-mobile-box{height:264px!important;margin-top:20px}
  body.cut-reel .pr-treegrow-mobile-label{font-size:18px!important;margin-top:16px!important}
</style>
</head>
<body>
<div id="tg-stage">__SECTION__</div>
<div id="tg-reel"></div>
<script>
(function(){
  // ── the timeline, in seconds ───────────────────────────────────────────────
  // LEAD is the beat of stillness before anything moves, so a viewer arriving
  // at frame one sees the seedling rather than a tree already halfway up.
  var LEAD = 0.6, STAGGER = 1.1, GROW = 0.6, COUNT = 0.55, TAIL = 2.0;
  // The phone swaps trees rather than standing them side by side: the one
  // that's there fades out, then the next fades in as it grows. Both numbers
  // are the ones index.html asks CSS for.
  var FADE = 0.22, RISE = 0.4;
  var WINDOW = Math.max(GROW, FADE + RISE);     // how long any of it is moving

  var q = new URLSearchParams(location.search);
  var t = parseFloat(q.get('t') || '0');
  var cut = q.get('cut') || 'panel';
  document.body.className = 'cut-' + cut;

  var isRow = document.documentElement.getAttribute('data-geo') === 'ROW';
  var CUR = isRow ? '$' : 'R';
  function money(n){ return CUR + Math.round(n).toLocaleString(isRow ? 'en-US' : 'en-ZA'); }

  var root = document.querySelector('.pr-treegrow');
  var counter = root.querySelector('.pr-treegrow-counter');
  var slots = [].slice.call(root.querySelectorAll('.pr-treegrow-slot'));
  counter.previousElementSibling.classList.add('pr-treegrow-eyebrow');   // "Saved so far"

  // The dollar cut relabels every milestone, the same swap index.html makes.
  if (isRow) {
    slots.forEach(function(s){
      if (!s.dataset.amountRow) return;
      s.dataset.amount = s.dataset.amountRow;
      var text = CUR + s.dataset.amount + ' saved';
      var img = s.querySelector('img'), label = s.querySelector('div:last-child');
      if (img) img.alt = text;
      if (label) label.textContent = text;
    });
  }
  var amounts = slots.map(function(s){ return parseInt(s.dataset.amount, 10); });
  var trees = slots.map(function(s){
    var img = s.querySelector('img'), src = s.querySelector('source');
    var label = s.querySelector('div:last-child');
    return { png: img.getAttribute('src'), webp: src ? src.getAttribute('srcset') : null,
             alt: img.alt, label: label ? label.textContent : img.alt };
  });

  // ── the two easings the page itself uses ───────────────────────────────────
  function bezier(x1, y1, x2, y2){
    function cx(p){ return ((1-3*x2+3*x1)*p + (3*x2-6*x1))*p*p + 3*x1*p; }
    function cy(p){ return ((1-3*y2+3*y1)*p + (3*y2-6*y1))*p*p + 3*y1*p; }
    return function(x){
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var lo = 0, hi = 1, p = x;
      for (var i = 0; i < 40; i++) {         // bisection: slower than Newton,
        var v = cx(p);                       // and it cannot fail to converge
        if (Math.abs(v - x) < 1e-6) break;
        if (v < x) lo = p; else hi = p;
        p = (lo + hi) / 2;
      }
      return cy(p);
    };
  }
  var EASE_OUT = bezier(0, 0, .58, 1);                  // CSS "ease-out"
  var EASE     = bezier(.25, .1, .25, 1);               // CSS "ease"
  var SPRING   = bezier(.22, 1, .36, 1);                // the rise, both layouts
  function easeOutCubic(p){ return 1 - Math.pow(1 - p, 3); }   // the counter tween
  function clamp(p){ return Math.max(0, Math.min(1, p)); }

  function startOf(i){ return LEAD + STAGGER * (i - 1); }      // slot 0 is there from the off
  var DURATION = startOf(slots.length - 1) + WINDOW + TAIL;

  // ── the row of five, as the desktop page shows it ──────────────────────────
  slots.forEach(function(s, i){
    var rise = i === 0 ? 1 : clamp((t - startOf(i)) / GROW);
    var fade = i === 0 ? 1 : clamp((t - startOf(i)) / 0.5);
    s.style.opacity = EASE_OUT(fade);
    s.style.transform = 'scaleY(' + (0.05 + 0.95 * SPRING(rise)) + ')';
  });

  // ── the one tree, as the phone shows it ────────────────────────────────────
  var box = root.querySelector('.pr-treegrow-mobile-box');
  var mobileImg = root.querySelector('.pr-treegrow-mobile-img');
  var mobileSrc = root.querySelector('.pr-treegrow-mobile picture source');
  var mobileLabel = root.querySelector('.pr-treegrow-mobile-label');
  if (mobileImg) {
    // Heights as a share of the phone's 150px box, so restyling that box for a
    // reel keeps every tree in proportion to the one before it.
    var SHARE = [38, 86, 100, 117, 130].map(function(h){ return h / 150; });
    var boxH = parseFloat(getComputedStyle(box).height);

    var stage = 0, opacity = 1;
    for (var i = 1; i < slots.length; i++) {
      var since = t - startOf(i);
      if (since < 0) break;
      if (since < FADE) { stage = i - 1; opacity = 1 - EASE(since / FADE); }   // the old one leaves
      else { stage = i; opacity = EASE(clamp((since - FADE) / FADE)); }        // the new one arrives
    }
    var swapped = stage;
    var h = SHARE[stage] * boxH;
    if (stage > 0) {
      var since = t - startOf(stage) - FADE;
      if (since < RISE) h = (SHARE[stage - 1] + (SHARE[stage] - SHARE[stage - 1]) * SPRING(clamp(since / RISE))) * boxH;
    }
    // Setting src alone would change nothing: the <source> beside it wins, and
    // on the live page it is pinned to the seedling — which is why the phone
    // shows the same tree growing rather than five different ones.
    if (mobileSrc && trees[swapped].webp) mobileSrc.srcset = trees[swapped].webp;
    mobileImg.src = trees[swapped].png;
    mobileImg.alt = trees[swapped].alt;
    mobileImg.style.opacity = opacity;
    mobileImg.style.height = h + 'px';
    mobileImg.style.transform = swapped === trees.length - 1 ? 'scale(1.12)' : 'none';
    mobileImg.style.transformOrigin = 'bottom center';
    if (mobileLabel) mobileLabel.textContent = trees[swapped].label;
  }

  // ── the tally ──────────────────────────────────────────────────────────────
  var value = amounts[0];
  for (var i = 1; i < slots.length; i++) {
    var p = clamp((t - startOf(i)) / COUNT);
    if (p <= 0) break;
    value = amounts[i - 1] + (amounts[i] - amounts[i - 1]) * easeOutCubic(p);
  }
  counter.textContent = money(value);

  // The reel is the panel on its own, lifted out of the card it sits in on the
  // page and stood in a 9:16 stage. Everything in it is still the page's.
  if (cut === 'reel') document.getElementById('tg-reel').appendChild(root);

  // ── hand the measurements back ─────────────────────────────────────────────
  // Read by build.py through --dump-dom, which never paints a frame, so a
  // requestAnimationFrame callback here may simply never run.
  setTimeout(function(){
    var d = window.devicePixelRatio || 1;
    function box(el, out){
      var r = el.getBoundingClientRect();
      document.documentElement.setAttribute('data-' + out, [r.left, r.top, r.width, r.height]
        .map(function(v){ return Math.round(v * d); }).join(','));
    }
    // The card is whichever ancestor actually paints the green — asking for it
    // by shape or position would go stale the moment the section is restyled.
    var card = root.parentElement;
    while (card && getComputedStyle(card).backgroundColor === 'rgba(0, 0, 0, 0)') card = card.parentElement;
    box(root, 'panel');
    if (card) box(card, 'card');
    box(document.getElementById('tg-reel'), 'reel');
    // The trees never fill the column they sit in, and neither does the counter
    // above them. Cropping to the column leaves a third of the picture empty
    // green down either side, so hand back what the artwork actually occupies
    // as well. scaleY leaves widths alone, so this is the same answer at every
    // moment of the clip.
    var l = Infinity, r = -Infinity;
    slots.forEach(function(s){
      var b = s.getBoundingClientRect();
      l = Math.min(l, b.left); r = Math.max(r, b.right);
    });
    document.documentElement.setAttribute('data-row', [l, 0, r - l, 0]
      .map(function(v){ return Math.round(v * d); }).join(','));
    var windows = [];
    for (var i = 1; i < slots.length; i++) windows.push(startOf(i) + ':' + (startOf(i) + WINDOW));
    document.documentElement.setAttribute('data-duration', DURATION.toFixed(3));
    document.documentElement.setAttribute('data-windows', windows.join(','));
  }, 0);
})();
</script>
</body>
</html>
