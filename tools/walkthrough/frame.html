<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>walkthrough capture frame</title>
<!--
  Headless Chrome refuses to make its window narrower than 500 CSS pixels, so
  asking it for a 390px phone viewport silently gives you 500px and a desktop
  layout. Rendering the app inside a fixed 390px iframe sidesteps that: the
  iframe is a real 390px viewport whatever the window does. build.py screenshots
  the window and crops to the iframe.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  iframe { border: 0; display: block; width: 390px; height: 844px; }
</style>
</head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  document.write('<iframe src="/.walkthrough-build/?' + q.toString() + '"></iframe>');
</script>
</body>
</html>
