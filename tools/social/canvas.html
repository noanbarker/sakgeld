<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>social canvas</title>
<!--
  The frame around the phone. Nothing else: no logo, no headline, no footer —
  the clips are the screen and the handset it sits in, and whatever words go with
  a post get written in the post.

  Rendered by Chrome rather than drawn in Python so the bezel keeps its gradient,
  its rounded corners and its soft shadow.

  The screen area is left blank on purpose. Chrome shoots this once as a still
  "plate", writes the screen rectangle onto <html data-screen>, and build.py
  pastes the app frames into that rectangle — one Chrome render for the whole
  clip instead of one per frame.

  Query parameters: ?w= ?h= (CSS pixels, half the output size), ?scale=,
  ?margin= (CSS pixels of breathing room around the handset).
-->
<style>
  html, body { margin:0; padding:0; }

  .canvas { position:relative; overflow:hidden; background:#f1f8f3;
            display:flex; align-items:center; justify-content:center; }

  /* Bezel. Same family as .pr-clip-shell on index.html, but with the wide
     camera notch cut into the top of the screen rather than a narrow tab. */
  .shell { position:relative; flex-shrink:0;
           background:linear-gradient(160deg,#3b4453 0%,#11161e 26%,#0b0f15 74%,#2b3341 100%);
           border-radius:var(--shell-r); padding:var(--shell-p);
           box-shadow:0 30px 70px rgba(11,18,26,.24), 0 8px 20px rgba(11,18,26,.16); }

  /* A hairline of lighter metal just inside the outer edge, which is what stops
     the bezel reading as a flat black rectangle. */
  .shell::before { content:""; position:absolute; inset:1px; border-radius:calc(var(--shell-r) - 1px);
                   box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); pointer-events:none; z-index:3; }

  /* The camera notch: a dark tab hanging down from the top of the screen,
     rounded along its bottom edge. */
  .shell::after { content:""; position:absolute; top:var(--shell-p); left:50%;
                  transform:translateX(-50%);
                  width:var(--notch-w); height:var(--notch-h); background:#0b0f15;
                  border-radius:0 0 var(--notch-r) var(--notch-r); z-index:2; }

  /* Left blank: build.py pastes the app frames in here. */
  .screen { display:block; width:var(--phone-w); height:var(--phone-h);
            border-radius:var(--screen-r); background:#fff; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const W = +(q.get('w') || 540);
  const H = +(q.get('h') || 960);
  const margin = +(q.get('margin') || 20);

  document.write(`
    <div class="canvas" style="width:${W}px;height:${H}px">
      <div class="shell"><div class="screen" id="screen"></div></div>
    </div>`);

  // The handset takes the whole canvas bar a margin, limited by whichever of
  // height or width runs out first.
  function fitPhone() {
    const canvas = document.querySelector('.canvas');
    // shell height = phoneW * (844/390) + 2 * (phoneW * 0.031)
    const byHeight = (canvas.clientHeight - margin * 2) / (844 / 390 + 0.062);
    const byWidth  = (canvas.clientWidth - margin * 2) / 1.062;
    const phoneW   = Math.floor(Math.min(byHeight, byWidth));
    const set = (k, v) => canvas.style.setProperty(k, v + 'px');
    set('--phone-w', phoneW);
    set('--phone-h', Math.round(phoneW * 844 / 390));
    set('--shell-p', Math.round(phoneW * 0.031));
    set('--shell-r', Math.round(phoneW * 0.125));
    set('--screen-r', Math.round(phoneW * 0.095));
    set('--notch-w', Math.round(phoneW * 0.32));
    set('--notch-h', Math.round(phoneW * 0.062));
    set('--notch-r', Math.round(phoneW * 0.036));
    return Math.round(phoneW * 0.095);
  }

  // setTimeout rather than requestAnimationFrame: build.py reads these
  // attributes back with Chrome's --dump-dom, which does not paint, so frame
  // callbacks may never run. Timers still fire, and getBoundingClientRect
  // forces the layout we need anyway.
  addEventListener('load', () => setTimeout(() => {
    const radius = fitPhone();
    const r = document.getElementById('screen').getBoundingClientRect();
    const dpr = +(q.get('scale') || 2);
    document.documentElement.setAttribute('data-screen',
      [r.left, r.top, r.width, r.height].map(v => Math.round(v * dpr)).join(','));
    document.documentElement.setAttribute('data-radius', String(Math.round(radius * dpr)));
    // The notch sits *inside* the screen area, so build.py has to redraw it on
    // top of each app frame — pasting the screenshot would otherwise bury it.
    const n = getComputedStyle(document.querySelector('.canvas'));
    const nw = parseFloat(n.getPropertyValue('--notch-w'));
    const nh = parseFloat(n.getPropertyValue('--notch-h'));
    document.documentElement.setAttribute('data-notch',
      [r.left + (r.width - nw) / 2, r.top, nw, nh,
       parseFloat(n.getPropertyValue('--notch-r'))].map(v => Math.round(v * dpr)).join(','));
    document.documentElement.setAttribute('data-demo-ready', '1');
  }, 40));
</script>
</body>
</html>
