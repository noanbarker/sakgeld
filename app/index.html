        /* Kid view: let the progress bar stretch */
        .sp-kid-progress-bar { width: 100% !important; max-width: 240px !important; }

        /* Kid content area */
        .sp-kid-content { padding: 16px 14px !important; }

        .sp-weekly-card { max-width: 100% !important; }

        /* Modals */
        .modal-sheet { padding: 20px 16px 28px !important; }

        /* Reconciliation rows: stack instead of squashing the difference column */
        .sp-recon-row { grid-template-columns: 1fr !important; gap: 4px !important; }
        .sp-recon-row > div:nth-child(2) { border-top: 1px solid var(--color-border); padding-top: 12px; margin-top: 8px; }
        .sp-recon-row > div:nth-child(3) { border-top: 1px solid var(--color-border); padding-top: 12px; margin-top: 8px; text-align: left !important; }
      }

      /* ── Parent dashboard: animated tab transitions (mobile only) ── */
      @media (max-width: 767px) {
        .sp-tab-anim-fwd  { animation: spTabSlideRight 0.42s cubic-bezier(0.16,1,0.3,1); }

        .sp-mob-tab-svg, .sp-sidebar-icon, .sp-mob-thumb, .sp-mob-divider { transition: none !important; }
      }

      /* ── Sign-up: pricing + account card ─────────────────────── */
      .su-grid { display:grid; grid-template-columns:1.08fr 1fr; gap:40px; align-items:start; }

      .su-bill-opt.active { border-color:var(--color-green-600); background:var(--color-green-50); }

// `geo` here is the visitor's detected location (see getGeoPref), which is what
// decided the price shown on the sign-up page — never the country dropdown,
// which is kept purely for our own Supabase analytics (see doSignUp).
function openTrialCheckout({ email, geo, userId, billingCycle }) {
    const isYearly = billingCycle === 'yearly';
    const isZA = geo === 'ZA';
    const priceId = isZA
        ? (isYearly ? PADDLE_YEARLY_PRICE_ID_ZA : PADDLE_MONTHLY_PRICE_ID_ZA)
        : (isYearly ? PADDLE_YEARLY_PRICE_ID : PADDLE_MONTHLY_PRICE_ID);
    // No customer.address here on purpose — leaving it out lets Paddle work
    // out the customer's real billing country and tax itself.
    Paddle.Checkout.open({
        items: [{ priceId, quantity: 1 }],
        customer: { email },
        customData: { supabase_user_id: userId }
    });
}

async function loadCache() {
    const uid = currentUser.id;
    const [kRes, cRes, compRes, txRes, bmRes, rwRes, rcRes, distRes, chRes, pinRes] = await Promise.all([
        sb.from('kids').select('id,user_id,name,emoji,balance,created_at,color_key,date_of_birth,last_distribution_at,cycle_amount,cycle_amount_pending').eq('user_id', uid),
        sb.from('chores').select('*').eq('user_id', uid),
        sb.from('completions').select('*').eq('user_id', uid),
        sb.from('transactions').select('*').eq('user_id', uid),
        sb.from('bonus_milestones').select('*').eq('user_id', uid),
        sb.from('rewards').select('*').eq('user_id', uid),
        sb.from('reward_completions').select('*').eq('user_id', uid),
        sb.from('distributions').select('*').eq('user_id', uid),
        sb.from('cycle_history').select('*').eq('user_id', uid),
        sb.rpc('has_parent_pin'),
    ]);
    hasParentPin = !!pinRes.data;
    cache = {
        kids: kRes.data || [],
        chores: (cRes.data || []).map(c => ({ ...c, assignedTo: c.assigned_to, oneOff: c.one_off || false, expiresOn: c.expires_on || null })),

async function initApp() {
    document.getElementById('app').innerHTML = '<div class="min-h-screen flex items-center justify-center"><p style="color:var(--color-text-secondary)">Loading…</p></div>';
    // Registered before getSession() below: Supabase processes a password-recovery
    // link's URL hash as part of that call, and only fires the PASSWORD_RECOVERY
    // event to listeners that are already attached when it happens. Attaching this
    // any later means the recovery link silently becomes a normal signed-in session.
    sb.auth.onAuthStateChange(async (event, session) => {
        currentUser = session?.user || null;
        if (event === 'PASSWORD_RECOVERY') {
            const intent = localStorage.getItem('sprout_recovery_intent');
            localStorage.removeItem('sprout_recovery_intent');
            S.authMode = intent === 'pin' ? 'reset-pin' : 'reset';
            render(); return;
        }
        if (currentUser) {
            await loadCache();
            // Only re-check for a cycle close-out on a genuinely new session, not
            // on every auth event. USER_UPDATED fires on every settings save
            // (including the close-out's own anchor-date rollover) and
            // TOKEN_REFRESHED fires periodically in the background — each carries
            // its own closure-captured `session` snapshot, so a delayed one of
            // these firing after a close-out has already run can hand
            // checkCycleCloseOut() stale, not-yet-advanced data and cause it to
            // process the same cycle a second time.
            if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
                await checkCycleCloseOut();
            }
        }
        else { cache = { kids: [], chores: [], completions: [], transactions: [], bonusMilestones: [], rewards: [], rewardCompletions: [], distributions: [], cycleHistory: [] }; S.view = 'home'; }
        render();
    });
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
        currentUser = session.user;
        const savedCurrency = session.user?.user_metadata?.currency;
        if (savedCurrency) localStorage.setItem('sprout_currency', savedCurrency);
        await loadCache();
        await checkCycleCloseOut();
    }
    render();
}

    const idx = (num >= 1 && num <= 41) ? num : 37;

function loadTreeThresholds() {
    const fromMeta = currentUser?.user_metadata?.tree_thresholds;
    if (fromMeta) return { ...DEFAULT_TREE_THRESHOLDS, ...fromMeta };
    try {
        const s = localStorage.getItem('sprout_tree_thresholds');
        return s ? { ...DEFAULT_TREE_THRESHOLDS, ...JSON.parse(s) } : { ...DEFAULT_TREE_THRESHOLDS };
    } catch { return { ...DEFAULT_TREE_THRESHOLDS }; }
}
async function saveTreeThresholds(t) {
    const { data, error } = await sb.auth.updateUser({ data: { tree_thresholds: t } });
    if (error) { toast('❌ Could not save thresholds.'); return false; }
    if (data?.user) currentUser = data.user;
    localStorage.setItem('sprout_tree_thresholds', JSON.stringify(t));
    return true;
}
function getTreeStage(balance) {
    const t = loadTreeThresholds();
    if (balance < t.t1) return 0;
    if (balance < t.t2) return 1;
    if (balance < t.t3) return 2;
    if (balance < t.t4) return 3;
    return 4;
}

function treeStageSVG(stageIndex, size = 80) {
    const files = ['1_Seedling_v2.webp', '2_Sapling_v2.webp', '3_Small_Tree_v2.webp', '4_Big_Tree_v2.webp', '5_Forest_v2.webp'];
    // This artwork set is drawn at similar native proportions across all 5 stages,
    // so — unlike the old set, where growth came from the source art itself —
    // the growth has to be enforced explicitly here: each stage renders a bit
    // taller than the last, independent of the source image's own dimensions.
    const scale = [0.62, 0.76, 0.88, 1, 1.18];
    const idx = Math.min(stageIndex, 4);
    const h = Math.round(size * scale[idx]);
    const pngFile = files[idx].replace(/\.webp$/i, '.png');
    return `<picture><source srcset="../images/${files[idx]}" type="image/webp"><img src="../images/${pngFile}" alt="${TREE_STAGES[idx].label}" style="height:${h}px;width:auto;display:block"></picture>`;
}

function R(n) {
    const code = getCurrencyCode();
    if (code === 'pts') return (+(n || 0)).toFixed(0) + ' pts';
    const curr = CURRENCIES.find(c => c.code === code) || { symbol: 'R' };
    const decimals = NO_DECIMAL_CURRENCIES.includes(code) ? 0 : 2;

    if (decimals > 0 && formatted.endsWith('.' + '0'.repeat(decimals))) {

const PARENT_TAB_ORDER = ['overview', 'money', 'chores', 'kids', 'bonuses', 'rewards', 'settings'];
function setTab(t) {
    const oldIdx = PARENT_TAB_ORDER.indexOf(S.tab);
    const newIdx = PARENT_TAB_ORDER.indexOf(t);
    const dir = newIdx === oldIdx ? null : (newIdx > oldIdx ? 'fwd' : 'back');
    if (dir) {
        const live = document.querySelector('.sp-tab-content');
        if (live) {
            const rect = live.getBoundingClientRect();
            const outgoing = live.cloneNode(true);
            outgoing.className = 'sp-tab-content ' + (dir === 'fwd' ? 'sp-tab-exit-fwd' : 'sp-tab-exit-back');
            outgoing.style.position = 'fixed';
            outgoing.style.top = rect.top + 'px';
            outgoing.style.left = rect.left + 'px';
            outgoing.style.width = rect.width + 'px';
            outgoing.style.height = rect.height + 'px';
            outgoing.style.margin = '0';
            outgoing.style.zIndex = '40';
            outgoing.style.pointerEvents = 'none';
            document.body.appendChild(outgoing);
            setTimeout(() => outgoing.remove(), 340);
        }
    }
    S.tabAnim = dir;
    S.tab = t; S.settingsSection = null; S.moneySection = null; render();

    // Mobile tab bar's sliding pill: since render() rebuilds the whole bar from
    // scratch, the thumb is a brand-new element each time and a plain CSS
    // transition never plays. Snap it back to the old spot with transitions
    // off, force a reflow, then transition to the real target so it visibly
    // slides across every tab in between (further apart = slower).
    if (dir) {
        const mobileBar = document.querySelector('.sp-mob-tabbar');
        const thumb = document.querySelector('.sp-mob-thumb');
        if (mobileBar && thumb) {
            const tabWidth = mobileBar.getBoundingClientRect().width / PARENT_TAB_ORDER.length;
            const duration = Math.min(900, 220 + Math.abs(newIdx - oldIdx) * 70);
            thumb.style.transition = 'none';
            thumb.style.transform = `translateX(${oldIdx * tabWidth}px)`;
            thumb.getBoundingClientRect();
            thumb.style.transition = `transform ${duration}ms cubic-bezier(0.65,0,0.35,1)`;
            thumb.style.transform = `translateX(${newIdx * tabWidth}px)`;
        }
    }
}

    // pick whichever nav item actually has size rather than hardcoding a breakpoint.
    let target = document.getElementById('nav-' + step.tab);

function weekStart() {
    const d = new Date(); const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const mon = new Date(d); mon.setDate(d.getDate() + diff); mon.setHours(0,0,0,0); return mon;
}
function weeklyEarned(db, kidId) {
    const mon = weekStart();
    return db.transactions
        .filter(t => t.kidId === kidId && t.type === 'chore' && new Date(t.createdAt) >= mon)
        .reduce((s, t) => s + t.amount, 0);
}
function weeklyPossible(db, kidId) {
    const mon = weekStart();
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const monStr = toLocalDateStr(mon);
    const sunStr = toLocalDateStr(sun);

    return db.chores
        .filter(c => !c.archived && choreAssignedTo(c, kidId))
        .reduce((s, c) => {
            if (c.oneOff) {
                // Include ad hoc chores that fall within the current week
                const exp = c.expiresOn || '';
                return (exp >= monStr && exp <= sunStr) ? s + c.value : s;
            }
            const freq = (!c.schedule || c.schedule === 'daily') ? 7 : (c.days || []).length;
            return s + (c.value * freq);
        }, 0);
}
function choreScheduleLabel(c) {
    if (c.oneOff) {
        const today = toLocalDateStr(new Date());
        if (!c.expiresOn || c.expiresOn <= today) return 'Today only';
        const d = new Date(c.expiresOn + 'T12:00:00');
        return `Until ${d.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' })}`;
    }
    if (!c.schedule || c.schedule === 'daily') return 'Daily';
    if (!c.days || c.days.length === 0) return 'No days set';
    if (c.days.length === 7) return 'Daily';
    return c.days.join(', ');
}
function choreIsForToday(c) {
    if (c.oneOff) return c.expiresOn >= toLocalDateStr(new Date());
    if (!c.schedule || c.schedule === 'daily') return true;
    const today = DAYS[(new Date().getDay() + 6) % 7];
    return (c.days || []).includes(today);
}
function toLocalDateStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function choreIsForDate(c, d) {
    if (c.oneOff) return c.expiresOn === toLocalDateStr(d);
    if (!c.schedule || c.schedule === 'daily') return true;
    const day = DAYS[(d.getDay() + 6) % 7];
    return (c.days || []).includes(day);
}
function choreScheduleWasActiveOn(c, d) {
    const ref = c.schedule_updated_at || c.created_at;
    if (!ref) return true;
    return toLocalDateStr(new Date(ref)) <= toLocalDateStr(d);
}
async function writeMissedChores(kidId) {
    const db = DB.load();
    const inserts = [];
    for (let ago = 1; ago <= 7; ago++) {
        const d = new Date();
        d.setDate(d.getDate() - ago);
        const due = toLocalDateStr(d);
        const scheduled = db.chores.filter(c => !c.archived && choreAssignedTo(c, kidId) && choreIsForDate(c, d) && choreScheduleWasActiveOn(c, d));
        for (const chore of scheduled) {
            const exists = cache.completions.some(c =>
                c.choreId === chore.id && c.kidId === kidId && c.dueDate === due
            );
            if (!exists) {
                const id = uid();
                const rec = {
                    id, user_id: currentUser.id,
                    chore_id: chore.id, kid_id: kidId,
                    completed_at: due + 'T23:59:59.000Z',
                    due_date: due, approved: false, rejected: false, missed: true
                };
                inserts.push(rec);
                cache.completions.push({ id, choreId: chore.id, kidId, completedAt: rec.completed_at, dueDate: due, approved: false, rejected: false, missed: true });
            }
        }
    }
    if (inserts.length) {
        await sb.from('completions').insert(inserts);
        render();
    }
}
function choreAssignedTo(c, kidId) {
    if (!c.assignedTo || c.assignedTo === 'all') return true;
    if (Array.isArray(c.assignedTo)) return c.assignedTo.includes(kidId);
    return c.assignedTo === kidId;
}
function choreAssignmentLabel(c, kids) {
    if (!c.assignedTo || c.assignedTo === 'all') return 'All kids';
    if (Array.isArray(c.assignedTo)) {
        if (c.assignedTo.length === kids.length) return 'All kids';
        return c.assignedTo.map(id => kids.find(k => k.id === id)?.name || '?').join(', ');
    }
    return kids.find(k => k.id === c.assignedTo)?.name || '?';
}

// ─── ALLOWANCE-PER-CYCLE SYSTEM ──────────────────────────────────
// Family-wide settings (stored alongside currency in user_metadata):
//   allowance_mode        'per_chore' | 'per_cycle'
//   cycle_period           'weekly' | 'biweekly' | 'monthly'
//   cycle_period_pending    queued period change, applied at the next cycle close
//   cycle_anchor_date       start date (YYYY-MM-DD) of the cycle currently running
const CYCLE_PERIOD_LABELS = { weekly: 'Weekly', biweekly: 'Biweekly', monthly: 'Monthly' };
function getAllowanceMode() { return currentUser?.user_metadata?.allowance_mode || 'per_chore'; }
function isCycleMode() { return getAllowanceMode() === 'per_cycle'; }
function getCyclePeriod() { return currentUser?.user_metadata?.cycle_period || 'weekly'; }
function getCyclePeriodPending() { return currentUser?.user_metadata?.cycle_period_pending || null; }
function getCycleAnchorDate() { return currentUser?.user_metadata?.cycle_anchor_date || toLocalDateStr(new Date()); }

// The natural boundary a cycle ends on: Sunday for weekly (and the short first
// biweekly cycle), the Sunday one week later for a biweekly cycle that starts
// on a Monday, and the last day of the month for monthly. This one rule covers
// both a clean full cycle and a short first cycle after activating mid-period.
function cycleEndDate(period, startDateStr) {
    const start = new Date(startDateStr + 'T00:00:00');
    if (period === 'monthly') {
        return toLocalDateStr(new Date(start.getFullYear(), start.getMonth() + 1, 0));
    }
    const day = start.getDay(); // 0 = Sun .. 6 = Sat
    const end = new Date(start);
    end.setDate(start.getDate() + (day === 0 ? 0 : 7 - day));
    if (period === 'biweekly' && day === 1) end.setDate(end.getDate() + 7); // full 2nd week, only when starting clean on a Monday
    return toLocalDateStr(end);
}
function cycleDayCount(period, startDateStr) {
    const start = new Date(startDateStr + 'T00:00:00');
    const end = new Date(cycleEndDate(period, startDateStr) + 'T00:00:00');
    return Math.round((end - start) / 86400000) + 1;
}
// Full-length day count for the period type — the proration denominator.
function naturalCycleDayCount(period, refDateStr) {
    if (period === 'monthly') {
        const d = new Date(refDateStr + 'T00:00:00');
        return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    }
    return period === 'biweekly' ? 14 : 7;
}
function choreWeight(c) { return c.weight == null ? 1 : (+c.weight || 1); }

// Weighted chores-assigned vs chores-completed for a kid over [startStr, endStr]
// inclusive. Quick (one-off) chores are excluded — they're a flat bonus, never
// part of the weighted cycle total. Days after today aren't counted yet.
function cycleWeightTotals(db, kidId, startStr, endStr) {
    let assigned = 0, completed = 0;
    const start = new Date(startStr + 'T00:00:00');
    const end = new Date(endStr + 'T00:00:00');
    const todayStr = toLocalDateStr(new Date());
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const dStr = toLocalDateStr(d);
        if (dStr > todayStr) continue;
        const scheduled = db.chores.filter(c => !c.oneOff && choreAssignedTo(c, kidId) && choreIsForDate(c, d) && choreScheduleWasActiveOn(c, d));
        for (const chore of scheduled) {
            const w = choreWeight(chore);
            assigned += w;
            const done = db.completions.some(comp => comp.choreId === chore.id && comp.kidId === kidId && comp.dueDate === dStr && comp.approved && !comp.rejected);
            if (done) completed += w;
        }
    }
    return { assigned, completed };
}
function cyclePercent(assigned, completed) {
    if (assigned <= 0) return 0;
    return Math.min(100, Math.ceil((completed / assigned) * 100));
}
// The amount ceiling for a cycle spanning [startStr, endStr] — a kid's full
// per-cycle amount, scaled down when that span is shorter than a natural full
// period (a first cycle after activating mid-period, or an early close-out).
function cycleAmountCeiling(fullAmount, period, startStr, endStr) {
    const naturalDays = naturalCycleDayCount(period, startStr);
    const start = new Date(startStr + 'T00:00:00');
    const end = new Date(endStr + 'T00:00:00');
    const actualDays = Math.round((end - start) / 86400000) + 1;
    return Math.round((fullAmount || 0) * Math.min(1, actualDays / naturalDays) * 100) / 100;
}
function cycleAmountPaid(ceiling, pct) { return Math.round((ceiling || 0) * (pct || 0) / 100 * 100) / 100; }
// A live, display-only estimate of what a kid would be paid if the cycle
// closed right now — same maths as the switch-away preview, just re-run daily.
// Not guaranteed to only go up: if new chores are assigned before they're
// done, the underlying percentage (and this figure) can dip until they're caught up.
function cycleTrendingEarned(db, kid) {
    const period = getCyclePeriod(), anchor = getCycleAnchorDate();
    const today = toLocalDateStr(new Date());
    const ceiling = cycleAmountCeiling(kid.cycle_amount, period, anchor, today);
    const { assigned, completed } = cycleWeightTotals(db, kid.id, anchor, today);
    return cycleAmountPaid(ceiling, cyclePercent(assigned, completed));
}

// Closes out the current cycle once its natural end date has passed: pays each
// kid their share, logs the cycle, applies any pending amount/period change,
// and advances the family's cycle_anchor_date to the day after. Lazy and
// idempotent-by-date, same pattern as writeMissedChores — checked once per app load.
// Guarded by cycleCloseOutRunning: onAuthStateChange fires on every auth event
// (including the redundant initial getSession() call in initApp), so without this
// guard two overlapping invocations can both read the same not-yet-advanced anchor
// and pay every kid twice for the same cycle.
let cycleCloseOutRunning = false;
async function checkCycleCloseOut() {
    if (!isCycleMode()) return;
    if (cycleCloseOutRunning) return;
    cycleCloseOutRunning = true;
    try {
        await runCycleCloseOut();
    } finally {
        cycleCloseOutRunning = false;
    }
}
async function runCycleCloseOut() {
    const period = getCyclePeriod();
    const anchor = getCycleAnchorDate();
    const end = cycleEndDate(period, anchor);
    const today = toLocalDateStr(new Date());
    if (today <= end) return;
    const db = DB.load();
    for (const kid of db.kids) {
        const ceiling = cycleAmountCeiling(kid.cycle_amount, period, anchor, end);
        const { assigned, completed } = cycleWeightTotals(db, kid.id, anchor, end);
        const pct = cyclePercent(assigned, completed);
        const amountPaid = cycleAmountPaid(ceiling, pct);
        const historyId = uid();
        // Real time the payout happened, not the cycle's end date — an end-date
        // timestamp can land before the kid's last distribution (e.g. a late
        // close-out), silently hiding the payout from "amount owed".
        const createdAt = new Date().toISOString();
        const desc = `${CYCLE_PERIOD_LABELS[period]} allowance (${pct}% of chores)`;
        if (amountPaid > 0) {
            const newBalance = (kid.balance || 0) + amountPaid;
            const txId = uid();
            await sb.from('kids').update({ balance: newBalance }).eq('id', kid.id).eq('user_id', currentUser.id);
            await sb.from('transactions').insert({ id: txId, user_id: currentUser.id, kid_id: kid.id, amount: amountPaid, type: 'cycle_allowance', description: desc, created_at: createdAt });
            kid.balance = newBalance;
            cache.transactions.push({ id: txId, kidId: kid.id, amount: amountPaid, type: 'cycle_allowance', description: desc, createdAt });
        }
        await sb.from('cycle_history').insert({ id: historyId, user_id: currentUser.id, kid_id: kid.id, period_type: period, start_date: anchor, end_date: end, weight_completed: completed, weight_assigned: assigned, percent: pct, amount_ceiling: ceiling, amount_paid: amountPaid, created_at: createdAt });
        cache.cycleHistory.push({ id: historyId, kidId: kid.id, periodType: period, startDate: anchor, endDate: end, weightCompleted: completed, weightAssigned: assigned, percent: pct, amountCeiling: ceiling, amountPaid: amountPaid, createdAt });

        const nextAmount = kid.cycle_amount_pending != null ? kid.cycle_amount_pending : kid.cycle_amount;
        await sb.from('kids').update({ cycle_amount: nextAmount, cycle_amount_pending: null }).eq('id', kid.id).eq('user_id', currentUser.id);
        kid.cycle_amount = nextAmount; kid.cycle_amount_pending = null;
    }
    const nextPeriod = getCyclePeriodPending() || period;
    const nextAnchorDate = new Date(end + 'T00:00:00'); nextAnchorDate.setDate(nextAnchorDate.getDate() + 1);
    const nextAnchor = toLocalDateStr(nextAnchorDate);
    const { data } = await sb.auth.updateUser({ data: { cycle_period: nextPeriod, cycle_period_pending: null, cycle_anchor_date: nextAnchor } });
    if (data?.user) currentUser = data.user;
    render();
}

function openModal(type, data = {}) {
    const defaultEmoji = (type === 'add-kid' || type === 'edit-kid') ? '😀' : '1';
    S.selectedEmoji    = data.emoji     || defaultEmoji;
    S.selectedColor    = data.color_key || 'blue';
    S.selectedSchedule = data.schedule  || 'daily';
    S.selectedDays     = data.days      ? [...data.days] : [];
    S.selectedWeight   = data.weight == null ? 1 : (+data.weight || 1);
    if (type === 'quick-task') {
        S.selectedKids = [];
    } else if (type === 'add-bonus') {
        S.selectedKids = 'all';
    } else if (type === 'edit-bonus') {
        const m = (cache.bonusMilestones || []).find(x => x.id === data.milestoneId);
        S.selectedKids = m ? (m.assignedTo === 'all' ? 'all' : Array.isArray(m.assignedTo) ? [...m.assignedTo] : [m.assignedTo]) : 'all';
    } else {
        S.selectedKids = !data.assignedTo || data.assignedTo === 'all' ? 'all'
                       : Array.isArray(data.assignedTo) ? [...data.assignedTo]
                       : [data.assignedTo];
    }
    S.modal = { type, data }; render();
}

async function doSignUp() {
    const name    = document.getElementById('l-name')?.value?.trim();
    const email   = document.getElementById('l-email')?.value?.trim();
    const pass    = document.getElementById('l-pass')?.value;
    const country = document.getElementById('l-country')?.value;
    const billingCycle = S.billingCycle || 'monthly';
    const errEl = document.getElementById('l-err');
    if (!name || !email || !pass || !country) { if (errEl) errEl.textContent = 'Please fill in all fields.'; return; }
    if (errEl) errEl.textContent = 'Creating account…';
    const geo = getGeoPref();
    const { data, error } = await sb.auth.signUp({
        email, password: pass,
        // `country` is only ever kept for analytics — it never decides pricing or tax.
        options: { data: { name, country, billing_cycle: billingCycle, signup_geo: geo } }
    });
    if (error) { if (errEl) errEl.textContent = error.message; return; }
    // Supabase never errors for an already-registered email — it silently returns
    // a fake user instead, to stop attackers probing which emails exist. The one
    // reliable tell is an empty identities array; a real new signup always has one.
    // Catching it here stops us ever sending Paddle a Supabase user id that
    // doesn't actually exist.
    if (!data?.user?.identities?.length) {
        S.signupDraft = captureSignupDraft();
        S.authMode = 'signin';
        render();
        toast('This email already has an account — please sign in.');
        return;
    }
    const userId = data?.user?.id;
    if (!userId) { if (errEl) errEl.textContent = 'Something went wrong creating your account.'; return; }
    if (errEl) errEl.textContent = '';
    openTrialCheckout({ email, geo, userId, billingCycle });
}

function onboardBack() { S.onboardStep = Math.max(S.onboardStep - 1, 0); render(); }
async function finishOnboarding() {
    const { data } = await sb.auth.updateUser({ data: { onboarding_complete: true } });
    if (data?.user) currentUser = data.user;
    go('home');
}

function reconDiffHTML(db, kid, bankVal) {
    const appBal = kid.balance || 0;
    const owed = owedSinceDistribution(db, kid);
    const expected = appBal - owed;
    const bankBal = (bankVal !== undefined && bankVal !== '') ? parseFloat(bankVal) : null;
    const diff = (bankBal !== null && !isNaN(bankBal)) ? bankBal - expected : null;
    const diffColor = diff === null ? '#94a3b8' : diff === 0 ? '#16a34a' : diff > 0 ? '#f59e0b' : '#f43f5e';
    const diffLabel = diff === null ? '—' : diff === 0 ? '✓ Balanced' : diff > 0 ? `+${R(diff)} more in bank` : `${R(Math.abs(diff))} likely spent`;
    const diffSub = diff === null ? 'Enter bank balance' : diff === 0 ? 'Matches what\'s expected' : diff > 0 ? 'Unexplained extra — check for an unlogged distribution' : 'Missing vs. expected';
    const spendBtn = (diff !== null && diff < 0)
        ? `<button onclick="recordReconSpend('${kid.id}')" class="chip-btn" style="margin-top:6px">Record as spent</button>`
        : '';
    return `<p style="font-family:var(--font-family);font-weight:800;font-size:15px;color:${diffColor}">${diffLabel}</p><p style="font-family:var(--font-family);font-size:11px;color:var(--color-text-muted);margin-top:2px">${diffSub}</p>${spendBtn}`;
}

function pRecon(db) {
    const sortedKids = [...db.kids].sort((a, b) => a.name.localeCompare(b.name));
    const saved = JSON.parse(localStorage.getItem('sprout_recon') || '{}');

    const rows = sortedKids.map(k => {
        const ac = kidAccent(k);
        const appBal = k.balance || 0;
        const owed = owedSinceDistribution(db, k);
        const expected = appBal - owed;
        const bankVal = saved[k.id] !== undefined ? saved[k.id] : '';

        return `
        <div class="card sp-recon-row" style="display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:12px;padding:16px 20px">
          <!-- Kid -->
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;background:${ac.bg};border:1.5px solid ${ac.border};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${kidIcon(k)}</div>
            <div>
              <p style="font-family:var(--font-family);font-weight:800;font-size:14px;color:var(--color-text-primary)">${esc(k.name)}</p>
              <p style="font-family:var(--font-family);font-size:12px;color:var(--color-text-secondary)">Expected vs. bank</p>
            </div>
          </div>
          <!-- Expected in bank + bank input -->
          <div style="display:flex;align-items:center;gap:10px">
            <div style="text-align:right;min-width:78px">
              <p style="font-family:var(--font-family);font-weight:800;font-size:15px;color:${ac.text}">${R(expected)}</p>
              <p style="font-family:var(--font-family);font-size:10px;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.08em">Expected in bank</p>
              <p style="font-family:var(--font-family);font-size:10px;color:var(--color-text-muted);margin-top:2px">${R(appBal)} app − ${R(owed)} owed</p>
            </div>
            <div style="color:#cbd5e1;font-size:18px;font-weight:300">↔</div>
            <div>
              <div style="display:flex;align-items:center;gap:4px;border:1.5px solid #e2e8f0;border-radius:10px;padding:6px 10px;background:white;width:110px">
                <span style="font-family:var(--font-family);font-size:13px;color:#94a3b8;flex-shrink:0">R</span>
                <input type="number" step="0.01" placeholder="0.00"
                  value="${bankVal}"
                  oninput="reconUpdate('${k.id}', this.value)"
                  style="font-family:var(--font-family);font-size:14px;font-weight:700;color:var(--color-text-primary);border:none;outline:none;width:100%;background:transparent"/>
              </div>
              <p style="font-family:var(--font-family);font-size:10px;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;padding-left:2px">Actual bank balance</p>
            </div>
          </div>
          <!-- Difference -->
          <div id="recon-diff-${k.id}" style="text-align:right">
            ${reconDiffHTML(db, k, bankVal)}
          </div>
        </div>`;
    }).join('');

    const allEntered = sortedKids.every(k => saved[k.id] !== undefined && saved[k.id] !== '');
    const totalExpected = sortedKids.reduce((s, k) => s + (k.balance || 0) - owedSinceDistribution(db, k), 0);
    const totalBank = allEntered ? sortedKids.reduce((s, k) => s + parseFloat(saved[k.id] || 0), 0) : null;
    const totalDiff = totalBank !== null ? totalBank - totalExpected : null;

    const summary = allEntered ? `
        <div class="card" style="background:linear-gradient(132deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;padding:16px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:center">
          <div>
            <p style="font-family:var(--font-family);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#15803d">Total expected</p>
            <p style="font-family:var(--font-family);font-size:22px;font-weight:900;color:#14532d">${R(totalExpected)}</p>
          </div>
          <div>
            <p style="font-family:var(--font-family);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#15803d">Total in bank</p>
            <p style="font-family:var(--font-family);font-size:22px;font-weight:900;color:#14532d">${R(totalBank)}</p>
          </div>
          <div style="text-align:right">
            <p style="font-family:var(--font-family);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#15803d">Difference</p>
            <p style="font-family:var(--font-family);font-size:22px;font-weight:900;color:${totalDiff === 0 ? '#16a34a' : '#f43f5e'}">${totalDiff === 0 ? '✓ All balanced' : R(totalDiff)}</p>
          </div>
        </div>` : '';

    return `
    <div style="max-width:760px">
      <div style="margin-bottom:24px">
        <h2 style="font-family:var(--font-family);font-size:22px;font-weight:900;color:var(--color-text-primary);letter-spacing:-0.02em">Reconciliation</h2>
        <p style="font-family:var(--font-family);font-size:13px;color:var(--color-text-secondary);margin-top:4px">"Expected in bank" is each kid's app balance minus whatever's still an outstanding distribution — in other words, what should realistically be sitting in their bank or piggy bank right now. Enter their actual balance to compare. A shortfall usually means money's been spent — you can log it straight from here.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        ${rows}
      </div>
      <div id="recon-summary">${summary}</div>
      <div style="margin-top:12px;text-align:right">
        <button onclick="reconClear()" style="font-family:var(--font-family);font-size:12px;color:var(--color-text-muted);text-decoration:underline;background:none;border:none;cursor:pointer">Clear all bank balances</button>
      </div>
    </div>`;
}

function reconUpdate(kidId, value) {
    const saved = JSON.parse(localStorage.getItem('sprout_recon') || '{}');
    saved[kidId] = value;
    localStorage.setItem('sprout_recon', JSON.stringify(saved));

    const db = DB.load();
    const kid = db.kids.find(k => k.id === kidId);
    if (!kid) return;

    const el = document.getElementById(`recon-diff-${kidId}`);
    if (el) el.innerHTML = reconDiffHTML(db, kid, value);

    // Update summary in-place
    const sortedKids = [...db.kids].sort((a, b) => a.name.localeCompare(b.name));
    const allEntered = sortedKids.every(k => saved[k.id] !== undefined && saved[k.id] !== '');
    const summaryEl = document.getElementById('recon-summary');
    if (summaryEl) {
        if (allEntered) {
            const totalExpected = sortedKids.reduce((s, k) => s + (k.balance || 0) - owedSinceDistribution(db, k), 0);
            const totalBank = sortedKids.reduce((s, k) => s + parseFloat(saved[k.id] || 0), 0);
            const totalDiff = totalBank - totalExpected;
            summaryEl.innerHTML = `<div class="card" style="background:linear-gradient(132deg,#f0fdf4,#dcfce7);border:1.5px solid #86efac;padding:16px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:center"><div><p style="font-family:var(--font-family);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#15803d">Total expected</p><p style="font-family:var(--font-family);font-size:22px;font-weight:900;color:#14532d">${R(totalExpected)}</p></div><div><p style="font-family:var(--font-family);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#15803d">Total in bank</p><p style="font-family:var(--font-family);font-size:22px;font-weight:900;color:#14532d">${R(totalBank)}</p></div><div style="text-align:right"><p style="font-family:var(--font-family);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#15803d">Difference</p><p style="font-family:var(--font-family);font-size:22px;font-weight:900;color:${totalDiff === 0 ? '#16a34a' : '#f43f5e'}">${totalDiff === 0 ? '✓ All balanced' : R(totalDiff)}</p></div></div>`;
        } else {
            summaryEl.innerHTML = '';
        }
    }
}

async function recordReconSpend(kidId) {
    const saved = JSON.parse(localStorage.getItem('sprout_recon') || '{}');
    const bankVal = saved[kidId];
    const bankBal = (bankVal !== undefined && bankVal !== '') ? parseFloat(bankVal) : null;
    if (bankBal === null || isNaN(bankBal)) return;

    const db = DB.load();
    const k = cache.kids.find(x => x.id === kidId);
    if (!k) return;
    const appBal = k.balance || 0;
    const owed = owedSinceDistribution(db, k);
    const expected = appBal - owed;
    const diff = bankBal - expected;
    if (diff >= 0) return toast('Nothing to record — bank balance already matches or exceeds expected.');

    const amount = Math.abs(diff);
    const id = uid();
    const createdAt = new Date().toISOString();
    const newBalance = appBal - amount;
    await sb.from('kids').update({ balance: newBalance }).eq('id', kidId).eq('user_id', currentUser.id);
    await sb.from('transactions').insert({ id, user_id: currentUser.id, kid_id: kidId, amount: -amount, type: 'expense', description: 'Recorded from reconciliation', created_at: createdAt });
    k.balance = newBalance;
    cache.transactions.push({ id, kidId, amount: -amount, type: 'expense', description: 'Recorded from reconciliation', createdAt });
    toast(`${R(amount)} recorded as spent for ${k.name}.`);
    render();
}

async function captureExpense() {
    snapModalInputs();
    const { kidId, amount: amtStr, description, date } = S.modal.data;
    const amount = parseFloat(amtStr) || 0;
    if (!kidId)    return toast('⚠️ Please select a kid.');
    if (amount<=0) return toast('⚠️ Please enter a valid amount.');
    const k = cache.kids.find(x => x.id === kidId);
    if (!k) return;
    const desc = (description || '').trim() || 'Money spent';
    const createdAt = date ? new Date(date + 'T12:00:00').toISOString() : new Date().toISOString();
    const newBalance = (k.balance || 0) - amount;
    const id = uid();
    await sb.from('kids').update({ balance: newBalance }).eq('id', kidId).eq('user_id', currentUser.id);
    await sb.from('transactions').insert({ id, user_id: currentUser.id, kid_id: kidId, amount: -amount, type: 'expense', description: desc, created_at: createdAt });
    k.balance = newBalance;
    cache.transactions.push({ id, kidId, amount: -amount, type: 'expense', description: desc, createdAt });
    closeModal();
    toast(`${R(amount)} recorded as spent for ${k.name}.`);
}

function deleteExpense(txId) {
    const t = cache.transactions.find(x => x.id === txId);
    if (!t) return;
    const k = cache.kids.find(x => x.id === t.kidId);
    openModal('confirm-delete', { msg: `Delete this ${R(Math.abs(t.amount))} expense${k ? ' for ' + esc(k.name) : ''}? Their balance will be restored.`, onConfirm: `doDeleteExpense('${txId}')` });
}
async function doDeleteExpense(txId) {
    const t = cache.transactions.find(x => x.id === txId);
    if (!t) return closeModal();
    const k = cache.kids.find(x => x.id === t.kidId);
    if (k) {
        const newBalance = (k.balance || 0) - t.amount;
        await sb.from('kids').update({ balance: newBalance }).eq('id', k.id).eq('user_id', currentUser.id);
        k.balance = newBalance;
    }
    await sb.from('transactions').delete().eq('id', txId).eq('user_id', currentUser.id);
    cache.transactions = cache.transactions.filter(x => x.id !== txId);
    closeModal();
    toast('Expense deleted and balance restored.');
}

function owedSinceDistribution(db, kid) {
    const since = kid.last_distribution_at ? new Date(kid.last_distribution_at) : null;
    // 'expense' transactions are spending against cash already handed over in a
    // past distribution, not against what's still owed — so they reduce the kid's
    // balance but must not reduce (or inflate) the owed figure itself.
    return db.transactions
        .filter(t => t.kidId === kid.id && t.type !== 'expense' && (!since || new Date(t.createdAt) > since))
        .reduce((s, t) => s + (t.amount || 0), 0);
}

async function runDistribution(kidId) {
    const db = DB.load();
    const k = cache.kids.find(x => x.id === kidId);
    if (!k) return;
    const owed = owedSinceDistribution(db, k);
    if (owed <= 0) return toast('Nothing owed since the last distribution.');
    const id = uid();
    const createdAt = new Date().toISOString();
    await sb.from('distributions').insert({ id, user_id: currentUser.id, kid_id: kidId, amount: owed, created_at: createdAt });
    await sb.from('kids').update({ last_distribution_at: createdAt }).eq('id', kidId).eq('user_id', currentUser.id);
    k.last_distribution_at = createdAt;
    cache.distributions.push({ id, kidId, amount: owed, createdAt });
    toast(`${R(owed)} marked as distributed to ${k.name}.`);
    render();
}

const FAQ_ITEMS = [
    { q: "How do I approve or reject a chore my child has marked as done?",
      a: `When a child marks a chore as done, it shows up under "Pending Chore Approvals" on your dashboard. Tap the checkmark to approve it or the cross to reject it - you can also use "Approve all" to clear every pending chore for one child at once.` },
    { q: "Does approving a chore send real money to my child?",
      a: `No. Sprout is a ledger, not a payment system - approving a chore adds to your child's balance inside the app only. When you're ready to hand over real money, use "Distribution Made" in Money Management to record that you've paid them and reset the amount owed.` },
    { q: "What's the difference between Amount per Chore and Amount per Cycle, and can I switch between them?",
      a: "With Amount per Chore, each chore has its own value and pays out the moment it's approved. With Amount per Cycle, you set one total amount for the week, fortnight or month, and each child's share is worked out from the percentage of chores they complete by the end of that cycle. You can switch between the two anytime in Settings." },
    { q: "Can I add more than one child, and can each one have different chores and amounts?",
      a: "Yes. Add as many children as you like from the Kids tab, each with their own PIN, avatar and colour. Chores can be assigned to one child, several, or all of them, and each child can have a different value per chore, or a different Amount per Cycle target." },
    { q: "What happens if my child misses a chore?",
      a: `If a chore's due date passes without it being marked done, it's automatically logged as missed at the end of that day. Missed chores don't pay out, and they show up under "Missed Chores" on your dashboard so you can see the full history. If however you know they did the chore and forgot to mark it as done, you can still approve it in the "Missed Chores" section.` },
    { q: "What are Distributions and Expenditure in Money Management?",
      a: `Distributions show how much you still owe each child since you last paid them out - tap "Distribution Made" once you've handed over the cash or made a bank transfer, and the amount owed resets to zero. Expenditure is a separate record of money your kids have actually spent from their bank account or piggy bank, which you can capture manually to keep the app's balance matching reality - recorded expenses don't count against what you still owe.` },
    { q: "What are Quick Chores, and how are they different from regular chores?",
      a: "Quick Chores are one-off tasks you can assign on the spot - say, helping wash the car - with their own reward and an expiry date you choose. If you're on the Amount per Cycle system, a Quick Chore's reward is added to your child's balance as soon as it's approved, unlike regular chores, which are only added to their balance at the end of the cycle." },
    { q: "What are bonuses and milestones, and how do my kids earn them?",
      a: "You can set a savings milestone with its own bonus amount. As soon as a child's balance reaches that threshold, the bonus is added automatically - no approval needed. It's a way to reward long-term saving on top of regular chores." },
    { q: "What are Rewards, and how are they different from chore earnings and bonuses?",
      a: "Rewards are for bigger, one-off goals - an exam mark, a sports achievement, anything worth celebrating - that you set up separately from regular chores. Like chores, a child marks a reward as done and you approve it before the amount is added to their balance. Bonuses, by contrast, are savings milestones that pay out automatically once a child's balance reaches a set amount, with no approval needed." },
    { q: "Can I edit or delete a chore after I've created it?",
      a: "Yes. Open the Chores tab, tap the pencil icon on any chore to change its name, value, schedule or who it's assigned to, or the trash icon to delete it. Editing a chore doesn't affect chores your child has already completed." },
    { q: "What does a chore's weighting (0.5x-2x) mean under Amount per Cycle?",
      a: "Weighting decides how much a chore counts toward a child's overall progress for the cycle, not how much it's worth in money. A chore weighted 2x counts double toward their percentage complete; one weighted 0.5x counts half. It's useful for making bigger or smaller chores count accordingly without assigning them an amount directly." },
    { q: "What happens if I switch from Amount per Cycle to Amount per Chore partway through a cycle?",
      a: "Switching mid-cycle closes it out early. You'll see exactly what each child has earned so far - worked out the same way as normal, just for a shorter period - before you confirm. That amount is added to their balance straight away, and every chore then needs its own value set before it pays out again." },
    { q: "What is Reconciliation, and when should I use it?",
      a: "Reconciliation lets you compare what the app says a child should have against what they actually have in real life, like their bank account or piggy bank. It's a quick way to check the two match up, especially after handing over cash or making a manual adjustment." },
    { q: "What if my child forgets their PIN, or I forget my parent PIN?",
      a: `You can reset a child's PIN anytime from their profile in the Kids tab. If you forget your own parent PIN, use "Forgot PIN?" on the PIN screen to reset it via your account email.` },
    { q: "Can I change our home currency after we've already set everything up?",
      a: "Yes, anytime in Settings. It changes how amounts are displayed going forward - existing chores, balances and history aren't converted, they just show under the new currency symbol." }
];

                pct      = possible > 0 ? Math.min(100, Math.round(earned / possible * 100)) : 0;
                earningsLabel = 'Earnings this week';
                earningsFooter = `${R(earned)} <span style="font-size:12px;font-weight:700;color:${ac.text}">of</span> <span style="font-size:13px;font-weight:800;color:${ac.header}">${R(possible)}</span>`;
            }
            const ringR = 26, ringC = 2 * Math.PI * ringR, ringOffset = ringC * (1 - pct / 100);
            const treeRingOffset = ringC * (1 - stagePct / 100);
            const earningsRing = `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;text-align:center">
              <p class="pr-section-label" style="color:${ac.text}">${earningsLabel}</p>
              <div style="position:relative;width:64px;height:64px">
                <svg width="64" height="64" viewBox="0 0 64 64" style="transform:rotate(-90deg)">
                  <circle cx="32" cy="32" r="${ringR}" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="8"/>
                  <circle cx="32" cy="32" r="${ringR}" fill="none" stroke="${ac.header}" stroke-width="8"
                    stroke-linecap="round"
                    stroke-dasharray="${ringC.toFixed(2)}"
                    stroke-dashoffset="${ringOffset.toFixed(2)}"/>
                </svg>
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                  <p style="font-family:var(--font-family);font-size:14px;font-weight:800;color:${ac.header};line-height:1">${pct}%</p>
                </div>
              </div>
              <p style="font-family:var(--font-family);font-size:13px;font-weight:800;color:${ac.header}">${earningsFooter}</p>
              ${cycleMode ? `<p style="font-family:var(--font-family);font-size:10px;font-weight:600;color:${ac.text};opacity:0.85;line-height:1.3">Updates as chores are approved — added to balance when the cycle ends</p>` : ''}
            </div>`;
            const treeRing = nextThresh ? `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;text-align:center">
              <p class="pr-section-label" style="color:var(--color-green-700)">Progress Status</p>
              <div style="position:relative;width:64px;height:64px">
                <svg width="64" height="64" viewBox="0 0 64 64" style="transform:rotate(-90deg)">
                  <circle cx="32" cy="32" r="${ringR}" fill="none" stroke="var(--color-green-100)" stroke-width="8"/>
                  <circle cx="32" cy="32" r="${ringR}" fill="none" stroke="var(--color-green-500)" stroke-width="8"
                    stroke-linecap="round"
                    stroke-dasharray="${ringC.toFixed(2)}"
                    stroke-dashoffset="${treeRingOffset.toFixed(2)}"/>
                </svg>
                <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                  <p style="font-family:var(--font-family);font-size:14px;font-weight:800;color:var(--color-green-700);line-height:1">${stagePct}%</p>
                </div>
              </div>
              <p style="font-family:var(--font-family);font-size:13px;font-weight:800;color:var(--color-green-700);display:flex;align-items:center;justify-content:center;gap:4px">${R(Math.max(0, nextThresh - kid.balance))} <span style="font-size:12px;font-weight:700;color:var(--color-text-secondary)">to</span> <span style="font-size:13px;font-weight:800;color:var(--color-green-700)">${TREE_STAGES[treeStageIdx + 1]?.label || ''}</span> <span style="display:inline-flex;width:36px;height:44px;align-items:center;justify-content:center">${treeStageSVG(treeStageIdx + 1, 36)}</span></p>
            </div>` : `
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;text-align:center">
              <p class="pr-section-label" style="color:var(--color-green-700)">Top tier</p>
              <div style="position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center">
                <svg width="64" height="64" viewBox="0 0 64 64" style="position:absolute;inset:0">
                  <circle cx="32" cy="32" r="${ringR}" fill="none" stroke="var(--color-green-500)" stroke-width="8"/>
                </svg>
                <p style="font-family:var(--font-family);font-size:24px;line-height:1">🏆</p>
              </div>
              <p style="font-family:var(--font-family);font-size:13px;font-weight:800;color:var(--color-green-700)">Forest achieved!</p>
            </div>`;
            return `
            <div class="card mb-4" style="background:${ac.bg};border:1.5px solid ${ac.border};display:flex;align-items:stretch;gap:12px">
              ${earningsRing}
              <div style="width:1px;background:rgba(255,255,255,0.6)"></div>
              ${treeRing}
            </div>`;
        })()}
        <p class="pr-section-label mb-3">
          Today's Chores
          <span style="font-family:var(--font-family);font-size:11px;font-weight:600;color:var(--color-text-secondary);letter-spacing:normal;text-transform:none;margin-left:6px">&mdash; ${new Date().toLocaleDateString('en-ZA',{weekday:'long', day:'numeric', month:'short'})}</span>
        </p>
        ${ready.length === 0
            ? `<div class="card text-center py-2 mb-6" style="color:var(--color-text-muted);font-family:var(--font-family);font-size:14px;font-weight:700"><picture><source srcset="../images/sprout-celebrating_800_cropped.webp" type="image/webp"><img src="../images/sprout-celebrating_800_cropped.png" alt="" style="height:75px;width:auto;display:block;margin:0 auto"></picture>All done for today!</div>`
            : `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 mb-6">
              ${ready.map(c => `
                <div class="card flex items-center gap-4">
                  <div style="flex-shrink:0;width:128px;height:128px;background:${ac.bg};border-radius:14px;display:flex;align-items:center;justify-content:center" class="sp-chore-icon">${choreIconSVG(c.emoji, 88)}</div>
                  <div class="flex-1 min-w-0">
                    <p style="font-family:var(--font-family);font-weight:800;color:var(--color-text-primary)">${esc(c.name)}</p>
                    ${c.description ? `<p style="font-family:var(--font-family);font-size:12px;color:var(--color-text-secondary);margin-top:2px">${esc(c.description)}</p>` : ''}
                    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px">
                      <p style="font-family:var(--font-family);color:${ac.header};font-weight:800;white-space:nowrap">${c.oneOff || !isCycleMode() ? `+ ${R(c.value)}` : `${choreWeight(c)}× weighting`}</p>
                      <span style="font-size:10px;background:${ac.bg};color:${ac.text};border-radius:6px;padding:2px 7px;font-family:var(--font-family);font-weight:700;white-space:nowrap">${choreScheduleLabel(c)}</span>
                    </div>
                  </div>
                  <button onclick="markDone('${c.id}', event)"
                    class="chore-done-btn flex-shrink-0" style="padding:8px 16px;font-size:13px">Done!</button>
                </div>`).join('')}
              </div>`}
        ${pending.length > 0 ? `
          <p class="pr-section-label mb-3 mt-2">Waiting for Approval</p>
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 mb-6">
            ${pending.map(c => {
              const chore = db.chores.find(x => x.id === c.choreId);
              return `
              <div class="card flex items-center gap-4" style="background:#fffbeb;border:1.5px solid #fde68a">
                <div style="flex-shrink:0;width:128px;height:128px;background:#fef3c7;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:0.7">${choreIconSVG(chore?.emoji, 88)}</div>
                <div class="flex-1 min-w-0">
                  <p style="font-family:var(--font-family);font-weight:800;color:#92400e">${esc(chore?.name) || 'Deleted chore'}</p>
                  <p style="font-family:var(--font-family);font-size:12px;color:#b45309;margin-top:2px">Waiting for parent ⏳</p>
                  <p style="font-family:var(--font-family);font-weight:800;color:var(--color-warning);margin-top:4px">${chore?.oneOff || !isCycleMode() ? `+ ${R(chore?.value)}` : `${choreWeight(chore || {})}× weighting`}</p>
                </div>
              </div>`;
            }).join('')}
          </div>` : ''}
        ${(() => {
            const milestones = (db.bonusMilestones || []).filter(m =>
                m.assignedTo === 'all' || (Array.isArray(m.assignedTo) && m.assignedTo.includes(kid.id))
            );
            if (!milestones.length) return '';
            const achieved = milestones.filter(m => (m.claimedBy || []).some(c => c.kidId === kid.id));
            const upcoming = milestones.filter(m => !(m.claimedBy || []).some(c => c.kidId === kid.id))
                                       .sort((a, b) => a.threshold - b.threshold);
            const upcomingCards = upcoming.map(m => {
                const pct = Math.min(100, Math.round((kid.balance / m.threshold) * 100));
                const stillNeeds = Math.max(0, m.threshold - kid.balance);
                return `
                <div class="card" style="border:1.5px solid #fed7aa">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
                    <div>
                      <p style="font-family:var(--font-family);font-weight:800;color:var(--color-text-primary);font-size:14px">${esc(m.name) || 'Balance Milestone'}</p>
                      <p style="font-family:var(--font-family);font-size:12px;color:var(--color-text-secondary);margin-top:2px">Save ${R(m.threshold)} to unlock</p>
                    </div>
                    <span style="font-family:var(--font-family);font-size:16px;font-weight:900;color:#f97316;flex-shrink:0;margin-left:12px">+${R(m.bonusAmount)}</span>
                  </div>
                  <div style="background:#fed7aa;border-radius:99px;height:8px;overflow:hidden;margin-bottom:6px">
                    <div style="background:#f97316;width:${pct}%;height:100%;border-radius:99px;transition:width 0.4s ease"></div>
                  </div>
                  <p style="font-family:var(--font-family);font-size:11px;font-weight:600;color:#92400e">
                    ${stillNeeds > 0 ? `${R(stillNeeds)} to go · ${pct}% there` : 'Threshold reached!'}
                  </p>
                </div>`;
            }).join('');
            const achievedCards = achieved.map(m => {
                const claim = (m.claimedBy || []).find(c => c.kidId === kid.id);
                const claimDate = claim ? new Date(claim.claimedAt).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
                return `
                <div class="card flex items-center gap-3" style="background:#f0fdf4;border:1.5px solid #bbf7d0">
                  <div style="width:40px;height:40px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">${milestoneStarSVG(20)}</div>
                  <div class="flex-1 min-w-0">
                    <p style="font-family:var(--font-family);font-weight:800;color:#15803d;font-size:13px">${esc(m.name) || 'Balance Milestone'}</p>
                    <p style="font-family:var(--font-family);font-size:11px;color:#16a34a;margin-top:1px">Earned on ${claimDate}</p>
                  </div>
                  <p style="font-family:var(--font-family);font-weight:900;color:#16a34a;font-size:15px;flex-shrink:0">+${R(m.bonusAmount)}</p>
                </div>`;
            }).join('');
            return `
            <p class="pr-section-label mb-3 mt-2">Bonuses</p>
            <div class="flex flex-col gap-2 mb-6">
              ${upcomingCards}
              ${achievedCards}
            </div>`;
        })()}
        ${(() => {
            const rewards = (db.rewards || []).filter(r =>
                !r.archived && (r.assignedTo === 'all' || (Array.isArray(r.assignedTo) && r.assignedTo.includes(kid.id)))
            );
            if (!rewards.length) return '';
            const cards = rewards.map(r => {
                const comps = (db.rewardCompletions || []).filter(c => c.rewardId === r.id && c.kidId === kid.id)
                                                            .sort((a, b) => new Date(b.claimedAt) - new Date(a.claimedAt));
                const achieved = comps.find(c => c.approved);
                const pending  = !achieved && comps.find(c => !c.approved && !c.rejected);
                if (achieved) {
                    const claimDate = new Date(achieved.approvedAt || achieved.claimedAt).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' });
                    return `
                    <div class="card flex items-center gap-4" style="background:#f0fdf4;border:1.5px solid #bbf7d0">
                      <div style="flex-shrink:0;width:64px;height:64px;background:#dcfce7;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#16a34a">${uiIcon('trophy', 36, 2)}</div>
                      <div class="flex-1 min-w-0">
                        <p style="font-family:var(--font-family);font-weight:800;color:#15803d">${esc(r.name)}</p>
                        <p style="font-family:var(--font-family);font-size:12px;color:#16a34a;margin-top:2px">Earned on ${claimDate}</p>
                        <p style="font-family:var(--font-family);font-weight:800;color:#16a34a;margin-top:4px">+ ${R(r.value)}</p>
                      </div>
                    </div>`;
                }
                if (pending) {
                    return `
                    <div class="card flex items-center gap-4" style="background:#fffbeb;border:1.5px solid #fde68a">
                      <div style="flex-shrink:0;width:64px;height:64px;background:#fef3c7;border-radius:14px;display:flex;align-items:center;justify-content:center;opacity:0.7;color:#b45309">${uiIcon('trophy', 36, 2)}</div>
                      <div class="flex-1 min-w-0">
                        <p style="font-family:var(--font-family);font-weight:800;color:#92400e">${esc(r.name)}</p>
                        <p style="font-family:var(--font-family);font-size:12px;color:#b45309;margin-top:2px">Waiting for parent ⏳</p>
                        <p style="font-family:var(--font-family);font-weight:800;color:var(--color-warning);margin-top:4px">+ ${R(r.value)}</p>
                      </div>
                    </div>`;
                }
                return `
                <div class="card flex items-center gap-4" style="border:1.5px solid #fed7aa">
                  <div style="flex-shrink:0;width:64px;height:64px;background:#fff7ed;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fb923c">${uiIcon('trophy', 36, 2)}</div>
                  <div class="flex-1 min-w-0">
                    <p style="font-family:var(--font-family);font-weight:800;color:var(--color-text-primary)">${esc(r.name)}</p>
                    ${r.description ? `<p style="font-family:var(--font-family);font-size:12px;color:var(--color-text-secondary);margin-top:2px">${esc(r.description)}</p>` : ''}
                    <p style="font-family:var(--font-family);color:#f97316;font-weight:800;margin-top:4px">+ ${R(r.value)}</p>
                  </div>
                  <button onclick="markRewardDone('${r.id}', event)"
                    class="chore-done-btn flex-shrink-0" style="padding:8px 16px;font-size:13px">Done!</button>
                </div>`;
            }).join('');
            return `
            <p class="pr-section-label mb-3 mt-2">Rewards</p>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 mb-6">
              ${cards}
            </div>`;
        })()}
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;margin-top:8px">
          <p class="pr-section-label" style="margin-bottom:0">History</p>
          <button onclick="toggleHistory()" style="font-family:var(--font-family);font-size:12px;font-weight:700;color:var(--color-text-muted);background:none;border:1.5px solid var(--color-border);border-radius:8px;padding:4px 10px;cursor:pointer">${S.historyOpen ? 'Hide history' : 'Show history'}</button>
        </div>
        ${S.historyOpen ? `
        <div class="flex flex-col gap-2">
          ${txns.length === 0
            ? `<div class="card text-center py-6" style="color:var(--color-text-muted);font-family:var(--font-family);font-size:14px">No transactions yet.</div>`
            : txns.map(t => `
              <div class="card flex items-center gap-2" style="padding:8px 12px">
                <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:${t.amount>0?ac.bg:'var(--color-coral-bg)'}">
                  ${typeIcon[t.type] || '💰'}
                </div>
                <div class="flex-1 min-w-0">
                  <p style="font-family:var(--font-family);font-weight:600;color:var(--color-text-primary);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.description)}</p>
                  <p style="font-family:var(--font-family);font-size:11px;color:var(--color-text-secondary)">${dateStr(t.createdAt)}</p>
                </div>
                <p style="font-family:var(--font-family);font-weight:800;font-size:13px;flex-shrink:0;color:${t.amount>0?ac.header:'var(--color-coral)'}">
                  ${t.amount>0?'+':''}${R(t.amount)}
                </p>
              </div>`).join('')}
        </div>` : ''}
        </div>
      </div>
    </div>`;
}

        <div class="relative mb-4">

          <input id="k-cycle-amount-pending" type="number" placeholder="Amount" value="${data.cycle_amount_pending ?? data.cycle_amount ?? ''}" step="0.01" min="0" style="padding-left:38px !important">
        </div>` : ''}

        <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px">

                ${sel ? '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}

              <span style="font-family:var(--font-family);font-size:10px;font-weight:700;color:${sel ? opt.header : 'var(--color-text-muted)'};letter-spacing:0.03em">${opt.label}</span>

async function saveBonusMilestone(editId) {
    const name      = document.getElementById('bm-name').value.trim();
    const threshold = parseFloat(document.getElementById('bm-threshold').value) || 0;
    const bonusAmt  = parseFloat(document.getElementById('bm-bonus').value) || 0;
    const assignedTo = S.selectedKids;
    if (threshold <= 0) return toast('⚠️ Please enter a balance milestone.');
    if (bonusAmt  <= 0) return toast('⚠️ Please enter a bonus amount.');
    if (!assignedTo || (Array.isArray(assignedTo) && assignedTo.length === 0)) return toast('⚠️ Please select at least one kid.');
    if (editId && editId !== 'null') {
        const m = cache.bonusMilestones.find(x => x.id === editId);
        if (!m) return;
        await sb.from('bonus_milestones').update({ name, threshold, bonus_amount: bonusAmt, assigned_to: assignedTo }).eq('id', editId).eq('user_id', currentUser.id);
        m.name = name; m.threshold = threshold; m.bonusAmount = bonusAmt; m.assignedTo = assignedTo;
        closeModal(); toast('Milestone updated.');
    } else {
        const id = uid(); const createdAt = new Date().toISOString();
        const { error } = await sb.from('bonus_milestones').insert({ id, user_id: currentUser.id, name, threshold, bonus_amount: bonusAmt, assigned_to: assignedTo, claimed_by: [], created_at: createdAt });
        if (error) return toast('❌ ' + (error.message || 'Could not save.'));
        cache.bonusMilestones.push({ id, name, threshold, bonusAmount: bonusAmt, assignedTo, claimedBy: [], createdAt });
        trackLoops(cache.bonusMilestones.length === 1 ? 'savings_goal_created' : null, { hasSavingsGoal: true });
        closeModal(); toast('Milestone added!', milestoneStarSVG(16));
        // Award immediately to any kid who already has enough saved, rather than
        // leaving it dangling until their next unrelated transaction happens to
        // trigger the check — until then their own screen would misleadingly show
        // "Threshold reached!" on a bonus they haven't actually been paid.
        const eligibleKids = assignedTo === 'all' ? cache.kids : cache.kids.filter(k => Array.isArray(assignedTo) && assignedTo.includes(k.id));
        for (const k of eligibleKids) {
            await checkBonusMilestones(k.id, k.balance || 0);
        }
    }
}
