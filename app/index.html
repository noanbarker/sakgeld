async function checkBonusMilestones(kidId, newBalance) {
    const eligible = (cache.bonusMilestones || []).filter(m => {
        const applies = m.assignedTo === 'all' || (Array.isArray(m.assignedTo) && m.assignedTo.includes(kidId));
        const claimed = (m.claimedBy || []).some(c => c.kidId === kidId);
        return applies && !claimed && newBalance >= m.threshold;
    });
    if (!eligible.length) return;
    const kid = cache.kids.find(k => k.id === kidId);
    if (!kid) return;
    const now = new Date().toISOString();
    let bonusTotal = 0;
    const txInserts = [];
    for (const m of eligible) {
        const newClaimed = [...(m.claimedBy || []), { kidId, claimedAt: now }];
        await sb.from('bonus_milestones').update({ claimed_by: newClaimed }).eq('id', m.id).eq('user_id', currentUser.id);
        m.claimedBy = newClaimed;
        bonusTotal += m.bonusAmount;
        const txId = uid();
        txInserts.push({ id: txId, user_id: currentUser.id, kid_id: kidId, amount: m.bonusAmount, type: 'bonus', description: `Bonus: ${m.name || 'Balance milestone'} (${R(m.threshold)})`, created_at: now });
        cache.transactions.push({ id: txId, kidId, amount: m.bonusAmount, type: 'bonus', description: `Bonus: ${m.name || 'Balance milestone'} (${R(m.threshold)})`, createdAt: now });
    }
    if (bonusTotal > 0) {
        const finalBalance = kid.balance + bonusTotal;
        await sb.from('kids').update({ balance: finalBalance }).eq('id', kidId).eq('user_id', currentUser.id);
        kid.balance = finalBalance;
        await sb.from('transactions').insert(txInserts);
        toast(`🎉 ${kid.name} earned ${eligible.length > 1 ? eligible.length + ' bonuses' : 'a bonus'}: +${R(bonusTotal)}!`);
        render();
    }
}

async function approveChore(cid) {
    const comp  = cache.completions.find(x => x.id === cid);
    if (!comp || comp.approved || comp.rejected) return;
    comp.approved = true;
    const chore = cache.chores.find(x => x.id === comp.choreId);
    const kid   = cache.kids.find(x => x.id === comp.kidId);
    render();
    const { data: won } = await sb.from('completions').update({ approved: true })
        .eq('id', cid).eq('user_id', currentUser.id).eq('approved', false).select('id');
    if (!won || !won.length) return;
    // In allowance-per-cycle mode, a normal chore's weight only feeds the cycle
    // progress bar — the payout happens once at cycle close, not per chore.
    // Quick (one-off) chores are a flat bonus and still pay out immediately in both modes.
    const paysOut = !isCycleMode() || chore?.oneOff;
    if (chore && kid && paysOut) {
        const newBalance = (kid.balance || 0) + chore.value;
        const txId = uid();
        // Real approval time, not the due date at noon — a due-date-derived
        // timestamp can land in the future relative to "now" (e.g. approving before
        // midday), which made same-day earnings vanish from "amount owed" right
        // after a distribution, since the Distributions filter only counts
        // transactions strictly after last_distribution_at.
        const txCreatedAt = new Date().toISOString();
        await sb.from('kids').update({ balance: newBalance }).eq('id', kid.id).eq('user_id', currentUser.id);
        await sb.from('transactions').insert({ id: txId, user_id: currentUser.id, kid_id: kid.id, amount: chore.value, type: 'chore', description: chore.name, created_at: txCreatedAt });
        kid.balance = newBalance;
        cache.transactions.push({ id: txId, kidId: kid.id, amount: chore.value, type: 'chore', description: chore.name, createdAt: txCreatedAt });
        await checkBonusMilestones(kid.id, newBalance);
    }
    const approvedCount = cache.completions.filter(c => c.approved).length;
    trackLoops(approvedCount === 1 ? 'first_chore_approved' : null, { hasApprovedChore: true });
    toast(paysOut ? `✓ Approved! ${R(chore?.value)} added to ${kid?.name}.` : `✓ Approved! Counts toward ${kid?.name}'s cycle progress.`);
    render();
}
async function approveAllForKid(kidId) {
    const kid   = cache.kids.find(x => x.id === kidId);
    if (!kid) return;
    const comps = cache.completions.filter(c => c.kidId === kidId && !c.approved && !c.rejected && !c.missed);
    if (!comps.length) return;
    const ids = comps.map(c => c.id);
    comps.forEach(comp => { comp.approved = true; });
    render();
    const { data: won } = await sb.from('completions').update({ approved: true })
        .in('id', ids).eq('user_id', currentUser.id).eq('approved', false).select('id');
    const wonIds = new Set((won || []).map(r => r.id));
    const wonComps = comps.filter(c => wonIds.has(c.id));
    const txInserts = [];
    let totalAdded = 0;
    wonComps.forEach(comp => {
        const chore = cache.chores.find(x => x.id === comp.choreId);
        if (chore && (!isCycleMode() || chore.oneOff)) {
            totalAdded += chore.value;
            const txCreatedAt = new Date().toISOString();
            txInserts.push({ id: uid(), user_id: currentUser.id, kid_id: kidId, amount: chore.value, type: 'chore', description: chore.name, created_at: txCreatedAt });
        }
    });
    if (totalAdded > 0) {
        const newBalance = (kid.balance || 0) + totalAdded;
        await sb.from('kids').update({ balance: newBalance }).eq('id', kidId).eq('user_id', currentUser.id);
        kid.balance = newBalance;
        await checkBonusMilestones(kidId, newBalance);
    }
    if (txInserts.length) {
        await sb.from('transactions').insert(txInserts);
        txInserts.forEach(t => cache.transactions.push({ id: t.id, kidId, amount: t.amount, type: t.type, description: t.description, createdAt: t.created_at }));
    }
    const approvedCountAll = cache.completions.filter(c => c.approved).length;
    trackLoops(approvedCountAll === wonComps.length ? 'first_chore_approved' : null, { hasApprovedChore: true });
    toast(isCycleMode() ? `✓ All approved! Counts toward ${kid.name}'s cycle progress${totalAdded > 0 ? ` (plus ${R(totalAdded)} from quick chores)` : ''}.` : `✓ All approved! ${R(totalAdded)} added to ${kid.name}.`);
    render();
}
async function rejectChore(cid) {
    await sb.from('completions').update({ rejected: true }).eq('id', cid).eq('user_id', currentUser.id);
    const c = cache.completions.find(x => x.id === cid);
    if (c) c.rejected = true;
    render();
}
function celebrateDone(btn) {
    if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    const pieces = ['🎉', '✨', '⭐', '💙', '🎊'];
    for (let i = 0; i < 10; i++) {
        const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.4;
        const dist = 50 + Math.random() * 40;
        const el = document.createElement('div');
        el.className = 'chore-confetti-piece';
        el.textContent = pieces[i % pieces.length];
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.setProperty('--cx', `${Math.cos(angle) * dist}px`);
        el.style.setProperty('--cy', `${Math.sin(angle) * dist - 20}px`);
        el.style.setProperty('--cr', `${(Math.random() - 0.5) * 200}deg`);
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 750);
    }
}
async function markDone(choreId, evt) {
    const now = new Date();
    const dueDate = toLocalDateStr(now);
    const already = cache.completions.some(c => c.choreId === choreId && c.kidId === S.kidId && c.dueDate === dueDate && !c.rejected);
    if (already) return;
    celebrateDone(evt?.currentTarget);
    const id = uid();
    const completedAt = now.toISOString();
    cache.completions.push({ id, choreId, kidId: S.kidId, completedAt, dueDate, approved: false, rejected: false, missed: false });
    render();
    const { error } = await sb.from('completions').insert({ id, user_id: currentUser.id, chore_id: choreId, kid_id: S.kidId, completed_at: completedAt, due_date: dueDate, approved: false, rejected: false, missed: false });
    if (error) {
        cache.completions = cache.completions.filter(c => c.id !== id);
        render();
        return toast('❌ Could not save. Check your connection.');
    }
    trackLoops(cache.completions.length === 1 ? 'first_chore_completed' : null, null);
    toast('Marked as done! Waiting for parent to approve. ⏳');
}
async function markRewardDone(rewardId, evt) {
    celebrateDone(evt?.currentTarget);
    const id = uid();
    const claimedAt = new Date().toISOString();
    const { error } = await sb.from('reward_completions').insert({ id, user_id: currentUser.id, reward_id: rewardId, kid_id: S.kidId, claimed_at: claimedAt, approved: false, rejected: false });
    if (error) return toast('❌ Could not save. Check your connection.');
    cache.rewardCompletions.push({ id, rewardId, kidId: S.kidId, claimedAt, approved: false, rejected: false });
    toast('Marked as done! Waiting for parent to approve. ⏳');
}
async function approveReward(cid) {
    const comp   = cache.rewardCompletions.find(x => x.id === cid);
    if (!comp) return;
    const reward = cache.rewards.find(x => x.id === comp.rewardId);
    const kid    = cache.kids.find(x => x.id === comp.kidId);
    const approvedAt = new Date().toISOString();
    await sb.from('reward_completions').update({ approved: true, approved_at: approvedAt }).eq('id', cid).eq('user_id', currentUser.id);
    comp.approved = true; comp.approvedAt = approvedAt;
    if (reward && kid) {
        const newBalance = (kid.balance || 0) + reward.value;
        const txId = uid();
        const txCreatedAt = new Date().toISOString();
        await sb.from('kids').update({ balance: newBalance }).eq('id', kid.id).eq('user_id', currentUser.id);
        await sb.from('transactions').insert({ id: txId, user_id: currentUser.id, kid_id: kid.id, amount: reward.value, type: 'reward', description: reward.name, created_at: txCreatedAt });
        kid.balance = newBalance;
        cache.transactions.push({ id: txId, kidId: kid.id, amount: reward.value, type: 'reward', description: reward.name, createdAt: txCreatedAt });
        await checkBonusMilestones(kid.id, newBalance);
    }
    toast(`✓ Approved! ${R(reward?.value)} added to ${kid?.name}.`);
    render();
}
async function rejectReward(cid) {
    await sb.from('reward_completions').update({ rejected: true }).eq('id', cid).eq('user_id', currentUser.id);
    const c = cache.rewardCompletions.find(x => x.id === cid);
    if (c) c.rejected = true;
    render();
}
async function saveTreeThresholdsFromUI() {
    const vals = ['t1','t2','t3','t4'].map(k => parseFloat(document.getElementById('thresh-'+k)?.value));
    if (vals.some(v => isNaN(v) || v <= 0)) return toast('⚠️ All thresholds must be positive numbers.');
    if (vals[0] >= vals[1] || vals[1] >= vals[2] || vals[2] >= vals[3])
        return toast('⚠️ Each threshold must be higher than the previous one.');
    const ok = await saveTreeThresholds({ t1: vals[0], t2: vals[1], t3: vals[2], t4: vals[3] });
    if (ok) { render(); toast('🌱 Tree thresholds saved!'); }
}
async function resetTreeThresholds() {
    const ok = await saveTreeThresholds({ ...DEFAULT_TREE_THRESHOLDS });
    if (ok) { render(); toast('Reset to defaults.'); }
}

function clearMissedChores() {
    const latest = cache.completions.filter(c => c.missed).map(c => c.dueDate || '').sort().pop() || toLocalDateStr(new Date());
    if (currentUser) currentUser.user_metadata = { ...currentUser.user_metadata, missed_cleared_at: latest };
    render();
    sb.auth.updateUser({ data: { missed_cleared_at: latest } }).then(({ data }) => {
        if (data?.user) currentUser = data.user;
    });
}

// Fire-and-forget Loops event/property sync for lifecycle email workflows.
// Never surfaces errors to the parent — this is invisible marketing plumbing,
// not something a failed request should ever interrupt real app use for.
function trackLoops(event, properties) {
    sb.auth.getSession().then(({ data }) => {
        const session = data && data.session;
        if (!session) return;
        fetch('/api/loops-track', {
            method: 'POST',
            headers: { Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ event: event || undefined, properties: properties || {} }),
        }).catch(() => {});
    }).catch(() => {});
}

async function openManageSubscription() {
    const btns = document.querySelectorAll('.manage-sub-btn');
    btns.forEach((b) => { b.disabled = true; b.style.opacity = '0.6'; });
    try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch('/api/paddle-portal', {
            method: 'POST',
            headers: { Authorization: `Bearer ${session.access_token}` }
        });
        const body = await res.json();
        if (!res.ok || !body?.urls?.general?.overview) {
            toast('❌ ' + (body?.error || 'Could not open subscription management.'));
            return;
        }
        window.open(body.urls.general.overview, '_blank');
    } catch (e) {
        toast('❌ Could not open subscription management.');
    } finally {
        render();
    }
}

function chooseAllowanceMode(mode) {
    if (mode === getAllowanceMode()) return;
    if (mode === 'per_cycle') activateCycleMode();
    else openModal('switch-to-per-chore');
}
async function activateCycleMode() {
    const period = getCyclePeriod();
    const today = toLocalDateStr(new Date());
    const { data } = await sb.auth.updateUser({ data: { allowance_mode: 'per_cycle', cycle_period: period, cycle_period_pending: null, cycle_anchor_date: today } });
    if (data?.user) currentUser = data.user;
    render();
    toast(`Amount per cycle turned on! This first cycle runs to ${dateStr(cycleEndDate(period, today))}.`);
}
// Applied directly, not queued as "pending" — during onboarding there's no
// real cycle running yet to protect, so the length can just change outright.
async function onboardSetCyclePeriod(period) {
    if (period === getCyclePeriod()) return;
    const { data } = await sb.auth.updateUser({ data: { cycle_period: period } });
    if (data?.user) currentUser = data.user;
    render();
}
async function queueCyclePeriodChange(period) {
    if (period === getCyclePeriod()) { cancelPendingCyclePeriod(); return; }
    const { data } = await sb.auth.updateUser({ data: { cycle_period_pending: period } });
    if (data?.user) currentUser = data.user;
    render();
    toast(`Starting next cycle: ${CYCLE_PERIOD_LABELS[period]}`);
}
async function cancelPendingCyclePeriod() {
    const { data } = await sb.auth.updateUser({ data: { cycle_period_pending: null } });
    if (data?.user) currentUser = data.user;
    render();
    toast('Pending cycle length change cancelled.');
}
async function confirmSwitchToPerChore() {
    const db = DB.load();
    const period = getCyclePeriod();
    const anchor = getCycleAnchorDate();
    const today = toLocalDateStr(new Date());
    for (const kid of db.kids) {
        const ceiling = cycleAmountCeiling(kid.cycle_amount, period, anchor, today);
        const { assigned, completed } = cycleWeightTotals(db, kid.id, anchor, today);
        const pct = cyclePercent(assigned, completed);
        const amountPaid = cycleAmountPaid(ceiling, pct);
        const historyId = uid();
        const createdAt = new Date().toISOString();
        const desc = `${CYCLE_PERIOD_LABELS[period]} allowance (${pct}% of chores, cycle closed early)`;
        if (amountPaid > 0) {
            const newBalance = (kid.balance || 0) + amountPaid;
            const txId = uid();
            await sb.from('kids').update({ balance: newBalance }).eq('id', kid.id).eq('user_id', currentUser.id);
            await sb.from('transactions').insert({ id: txId, user_id: currentUser.id, kid_id: kid.id, amount: amountPaid, type: 'cycle_allowance', description: desc, created_at: createdAt });
            kid.balance = newBalance;
            cache.transactions.push({ id: txId, kidId: kid.id, amount: amountPaid, type: 'cycle_allowance', description: desc, createdAt });
        }
        await sb.from('cycle_history').insert({ id: historyId, user_id: currentUser.id, kid_id: kid.id, period_type: period, start_date: anchor, end_date: today, weight_completed: completed, weight_assigned: assigned, percent: pct, amount_ceiling: ceiling, amount_paid: amountPaid, created_at: createdAt });
        cache.cycleHistory.push({ id: historyId, kidId: kid.id, periodType: period, startDate: anchor, endDate: today, weightCompleted: completed, weightAssigned: assigned, percent: pct, amountCeiling: ceiling, amountPaid: amountPaid, createdAt });
    }
    const { data } = await sb.auth.updateUser({ data: { allowance_mode: 'per_chore', cycle_period_pending: null, cycle_anchor_date: null } });
    if (data?.user) currentUser = data.user;
    closeModal();
    toast('Switched to amount per chore. Check your chores — each one needs its own amount before it pays out.');
}
function saveCurrency(code) {
    localStorage.setItem('sprout_currency', code);
    render();
    toast('Currency updated!');
    sb.auth.updateUser({ data: { currency: code } }).then(({ data }) => {
        if (data?.user) currentUser = data.user;
    });
}

async function saveParentPin() {
    const pin = document.getElementById('pp-pin').value.trim();
    if (!/^\d{4}$/.test(pin)) return toast('⚠️ PIN must be exactly 4 digits.');
    const { error } = await sb.rpc('set_parent_pin', { p_new_pin: pin });
    if (error) return toast('❌ Could not save PIN.');
    hasParentPin = true;
    closeModal(); toast('Parent PIN saved! 🔐');
}
async function removeParentPin() {
    const { error } = await sb.rpc('remove_parent_pin');
    if (error) return toast('❌ Could not remove PIN.');
    hasParentPin = false;
    closeModal(); toast('Parent PIN removed.');
}

// ─── RENDER ──────────────────────────────────────────────────────
function render() {
    document.title = currentUser ? 'Sprout' : 'Sign In or Start Your Free Trial | Sprout';
    const toastHtml = S.toast
        ? `<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;background:#1e293b;color:white;font-family:var(--font-family);font-size:14px;font-weight:600;padding:10px 20px;border-radius:var(--radius-full);box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:99;max-width:320px;text-align:center">${S.toastIcon || ''}${esc(S.toast)}</div>`
        : '';
    if (S.authMode === 'reset') {
        document.getElementById('app').innerHTML = vResetPassword() + toastHtml;
        return;
    }
    if (S.authMode === 'reset-pin') {
        document.getElementById('app').innerHTML = vResetParentPin() + toastHtml;
        return;
    }
    if (!currentUser) {
        document.getElementById('app').innerHTML = vLogin() + toastHtml;
        return;
    }
    const subStatus = currentUser.user_metadata?.subscription_status;
    if (subStatus !== 'trialing' && subStatus !== 'active') {
        document.getElementById('app').innerHTML = vSubscriptionGate() + toastHtml;
        return;
    }
    const views = { home: vHome, parent: vParent, 'kid-pin': vKidPin, kid: vKid, 'parent-pin': vParentPin, 'parent-onboarding': vOnboarding };
    const html  = (views[S.view] || vHome)();
    const app = document.getElementById('app');
    // Re-render replaces the whole subtree on every state change (tab switches
    // included), which recreates the mobile header's logo <img> from scratch each
    // time and produces a visible flash as the browser reflows/repaints it. Reuse
    // the already-painted node instead of letting the fresh one take its place.
    const prevLogo = app.querySelector('.sp-mobile-logo');
    const showTutorialNudge = S.view === 'parent' && S.tourStep < 0 && !S.modal && !tutorialNudgeDismissed();
    app.innerHTML = html + renderModal() + (showTutorialNudge ? renderTutorialNudge() : '') + toastHtml;
    if (prevLogo) {
        const newLogo = app.querySelector('.sp-mobile-logo');
        if (newLogo && newLogo.src === prevLogo.src) newLogo.replaceWith(prevLogo);
    }
    if (S.view === 'parent' && S.tourStep >= 0) positionTourSpotlight();
    S.tabAnim = null;
}

initApp();
